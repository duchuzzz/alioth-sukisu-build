# 放在一个「只有这个文件」的空仓库里就能跑，不需要 fork 内核仓库。
# 路径: .github/workflows/build.yml
# 触发: Actions 页面 → Build alioth kernel + SukiSU 4.x → Run workflow
# 产物: alioth-Image-<ref> artifact（Image + kernel.config）

name: Build alioth kernel + SukiSU 4.x

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "内核仓库"
        default: "KopsourcesORG/KosminorKernel-Alioth"
      kernel_ref:
        description: "内核分支/标签"
        default: "hyper-2"
      sukisu_ref:
        description: "SukiSU 版本（v4.3.0 = 4.x 管理器配套）"
        default: "v4.3.0"
      defconfig:
        description: "defconfig 目标"
        default: "alioth_kosminor_defconfig"
      enable_kpm:
        description: "启用 CONFIG_KPM"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: 加 SWAP（runner 只有 16 GB，LTO 链接会 OOM）
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 8

      - name: 取 CI 仓库（拿兼容补丁脚本）
        uses: actions/checkout@v4

      - name: 取内核源码（含子模块：security/baseband-guard 是符号链接，缺了 config 就报错）
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.kernel_repo }}
          ref: ${{ inputs.kernel_ref }}
          path: kernel
          fetch-depth: 1
          submodules: recursive

      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git automake build-essential bc flex bison libssl-dev liblz4-tool rsync

      - name: 清掉仓库自带的 KernelSU（必须换成 SukiSU）
        working-directory: kernel
        run: |
          rm -rf KernelSU
          rm -f drivers/kernelsu
          sed -i '/KernelSU/d' .gitmodules 2>/dev/null || true
          echo "drivers/Makefile:"; grep -n kernelsu drivers/Makefile || true
          echo "drivers/Kconfig:";  grep -n kernelsu drivers/Kconfig || true

      - name: 缓存工具链（省 2 分钟）
        uses: actions/cache@v4
        with:
          path: |
            kernel/toolchain/llvm
            kernel/toolchain/python2
          key: alioth-toolchain-clang-standalone-v1

      - name: 工具链（clang-standalone + python2）
        working-directory: kernel
        run: |
          [ -d toolchain/llvm ]   || git clone --depth 1 https://gitlab.com/ThankYouMario/android_prebuilts_clang-standalone.git toolchain/llvm
          [ -d toolchain/python2 ] || git clone --depth 1 https://github.com/KopsourcesORG/python-2.7.18-prebuilt.git toolchain/python2
          ./toolchain/llvm/bin/clang --version | head -n 1

      - name: 接入 SukiSU ${{ inputs.sukisu_ref }}
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s "${{ inputs.sukisu_ref }}"
          echo "--- symlink ---"; ls -l drivers/kernelsu
          echo "--- 驱动 Kconfig 依赖 ---"; grep -n -A3 '^config KSU' drivers/kernelsu/Kconfig | head -n 8
          echo "--- 驱动版本 ---"; git -C KernelSU describe --tags --always

      - name: 写 defconfig（KPROBES 是 4.x 的硬依赖）
        working-directory: kernel
        run: |
          D="arch/arm64/configs/${{ inputs.defconfig }}"
          printf 'CONFIG_KSU=y\nCONFIG_KPROBES=y\nCONFIG_KSU_MANUAL_SU=y\nCONFIG_KALLSYMS=y\nCONFIG_KALLSYMS_ALL=y\n' >> "$D"
          if [ "${{ inputs.enable_kpm }}" = "true" ]; then printf 'CONFIG_KPM=y\n' >> "$D"; fi
          echo "=== defconfig 尾部 ==="; tail -n 10 "$D"

      - name: 4.19 兼容补丁（nofault / TWA_RESUME / MODULE_IMPORT_NS）
        run: |
          python3 patch-419.py kernel
          echo "=== 确认打过 ==="
          grep -rl 'ksu-4.19-compat: start' kernel/drivers/kernelsu --include='*.c' | head

      - name: 编译
        working-directory: kernel
        run: |
          export ARCH=arm64 SUBARCH=arm64
          export PATH="$PWD/toolchain/llvm/bin:$PWD/toolchain/python2/bin:$PATH"
          export LD_LIBRARY_PATH="$PWD/toolchain/llvm/lib64:$PWD/toolchain/python2/lib:${LD_LIBRARY_PATH:-}"
          export CC=clang LLVM=1 LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export LOCALVERSION=-sukisu4
          export KBUILD_BUILD_HOST=Github-Action
          export KBUILD_BUILD_USER=actions
          make O=out "${{ inputs.defconfig }}"
          make -j"$(nproc --all)" O=out prepare
          # objsec.h 里 #include "flask.h"，flask.h 是 security/selinux 构建时生成的，
          # 而 drivers/ 比 security/ 先编，先把 selinux 目录编出来再编驱动
          make -j"$(nproc --all)" O=out security/selinux/
          # 先只编驱动，出错 1-2 分钟就暴露，不用等整核
          make -j"$(nproc --all)" O=out drivers/kernelsu/
          make -j"$(nproc --all)" O=out

      - name: 断言 config 没被 Kconfig 丢弃
        working-directory: kernel
        run: |
          echo "=== 关键项 ==="
          grep -E '^CONFIG_(KSU|KPM|KPROBES|KRETPROBES|KALLSYMS|KALLSYMS_ALL|EXT4_FS)=' out/.config || true
          grep -q '^CONFIG_KSU=y'      out/.config || { echo "::error::CONFIG_KSU 没进 config —— 检查 KPROBES/EXT4_FS 依赖是否满足"; exit 1; }
          grep -q '^CONFIG_KPROBES=y'  out/.config || { echo "::error::CONFIG_KPROBES 没进 config"; exit 1; }

      - name: 收集产物
        working-directory: kernel
        run: |
          mkdir -p ../artifact
          cp out/arch/arm64/boot/Image ../artifact/Image
          cp out/.config ../artifact/kernel.config
          ls -l ../artifact
          echo "=== 内核版本串 ==="
          strings ../artifact/Image | grep -m2 'Linux version'
          echo "=== 驱动串 ==="
          strings ../artifact/Image | grep -m3 -i 'KernelSU'

      - uses: actions/upload-artifact@v4
        with:
          name: alioth-Image-${{ inputs.sukisu_ref }}
          path: artifact/*
          if-no-files-found: error
